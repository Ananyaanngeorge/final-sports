# ==================================================
# Sports Equipment Management System - Configuration
# ==================================================

# Server Port for REST API
server.port=8080

# MySQL Database Configuration
# NOTE FOR STUDENTS: Replace YOUR_MYSQL_PASSWORD with your actual MySQL root password!
spring.datasource.url=jdbc:mysql://localhost:3306/sports_equipment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Ananya@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
